<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <title>Danh thiếp | Công ty Cổ phần BPO Mắt Bão</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: linear-gradient(135deg, #eef4f8, #dce8f0);
      font-family: Arial, Helvetica, sans-serif; color: #183247;
    }
    .card {
      width: min(100%, 520px); background: #fff; border-radius: 22px;
      overflow: hidden; box-shadow: 0 18px 55px rgba(22, 52, 75, .16);
    }
    .header {
      padding: 34px 30px 30px; color: #fff;
      background: linear-gradient(135deg, #123b5d, #176b83);
    }
    .eyebrow { margin: 0 0 12px; font-size: 12px; letter-spacing: 2px; opacity: .82; }
    h1 { margin: 0; font-size: clamp(23px, 5vw, 30px); line-height: 1.25; }
    .subtitle { margin: 10px 0 0; font-size: 14px; opacity: .86; }
    .content { padding: 28px 30px 30px; }
    .label { margin: 0 0 10px; color: #6b7f8e; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
    .address {
      display: block; color: #126b9a; font-size: 17px; line-height: 1.6;
      font-weight: 700; text-decoration: none; padding: 15px 16px;
      border: 1px solid #d8e7ef; border-radius: 13px; background: #f6fafc;
    }
    .address:hover { background: #edf6fa; text-decoration: underline; }
    .hint { margin: 10px 2px 0; color: #718391; font-size: 13px; line-height: 1.5; }
    .button {
      display: flex; justify-content: center; align-items: center; gap: 9px;
      margin-top: 22px; padding: 14px 18px; border-radius: 12px;
      background: #176b83; color: #fff; font-weight: 700; text-decoration: none;
    }
    .button:hover { background: #12566a; }
    .footer { padding: 0 30px 25px; color: #91a0aa; font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <p class="eyebrow">DANH THIẾP ĐIỆN TỬ</p>
      <h1>CÔNG TY CỔ PHẦN<br>BPO MẮT BÃO</h1>
      <p class="subtitle">Thông tin địa chỉ liên hệ</p>
    </header>
    <section class="content">
      <p class="label">Địa chỉ</p>
      <a class="address"
         href="https://www.google.com/maps/search/?api=1&query=T%E1%BA%A7ng+19%2C+T%C3%B2a+nh%C3%A0+Icon4%2C+243A+%C4%90%C3%AA+La+Th%C3%A0nh%2C+L%C3%A1ng%2C+H%C3%A0+N%E1%BB%99i"
         target="_blank" rel="noopener noreferrer">
        Tầng 19, Tòa nhà Icon4, 243A Đê La Thành, Láng, Hà Nội
      </a>
      <p class="hint">Chạm vào dòng địa chỉ hoặc nút bên dưới để mở vị trí trên Google Maps.</p>
      <a class="button"
         href="https://www.google.com/maps/search/?api=1&query=T%E1%BA%A7ng+19%2C+T%C3%B2a+nh%C3%A0+Icon4%2C+243A+%C4%90%C3%AA+La+Th%C3%A0nh%2C+L%C3%A1ng%2C+H%C3%A0+N%E1%BB%99i"
         target="_blank" rel="noopener noreferrer">📍 Mở Google Maps</a>
    </section>
    <div class="footer">CÔNG TY CỔ PHẦN BPO MẮT BÃO</div>
  </main>
</body>
</html>
